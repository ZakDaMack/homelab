apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-oidc-reader
  namespace: identity
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-oidc-reader-token
  namespace: identity
rules:
  - apiGroups:
      - ""
    resources:
      - serviceaccounts/token
    resourceNames:
      - argocd-oidc-reader
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-oidc-reader-token
  namespace: identity
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-oidc-reader-token
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-argocd-oidc
spec:
  conditions:
    - namespaces:
        - identity
        - argocd
  provider:
    openBao:
      server: http://openbao.openbao.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          path: kubernetes
          role: eso-argocd-oidc
          serviceAccountRef:
            name: argocd-oidc-reader
            namespace: identity
            audiences:
              - openbao
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-argocd-oidc
  target:
    name: argocd-oidc-openbao
  data:
    - secretKey: client-secret
      remoteRef:
        key: keys/argocd
        property: oidc_client_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-argocd-oidc
  target:
    name: argocd-oidc-openbao
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
      mergePolicy: Merge
  data:
    - secretKey: client-secret
      remoteRef:
        key: keys/argocd
        property: oidc_client_secret
