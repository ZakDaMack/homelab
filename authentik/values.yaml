global:
  env:
    - name: AUTHENTIK_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-openbao
          key: secret-key
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-openbao
          key: password

authentik:
  error_reporting:
    enabled: true

server:
  ingress:
    ingressClassName: ingress-traefik
    enabled: true
    hosts:
      - authentik.k8s.zakhaven.uk
      
postgresql:
  enabled: true
  auth:
    existingSecret: authentik-openbao
