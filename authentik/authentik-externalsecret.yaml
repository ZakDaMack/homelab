apiVersion: v1
kind: ServiceAccount
metadata:
  name: authentik-secret-reader
  namespace: identity
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authentik-secret-reader-token
  namespace: identity
rules:
  - apiGroups:
      - ""
    resources:
      - serviceaccounts/token
    resourceNames:
      - authentik-secret-reader
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authentik-secret-reader-token
  namespace: identity
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authentik-secret-reader-token
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-authentik
  namespace: identity
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    openBao:
      server: http://openbao.openbao.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          path: kubernetes
          role: eso-identity-authentik
          serviceAccountRef:
            name: authentik-secret-reader
            audiences:
              - openbao
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik
  namespace: identity
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao-authentik
  target:
    name: authentik-openbao
  data:
    - secretKey: secret-key
      remoteRef:
        key: keys/authentik
        property: secret_key
    - secretKey: password
      remoteRef:
        key: keys/authentik
        property: postgresql_password
    - secretKey: postgres-password
      remoteRef:
        key: keys/authentik
        property: postgresql_admin_password
