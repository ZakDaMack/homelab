apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: openbao
    server: {{ .Values.spec.destination.server }}
  project: default
  sources:
    - repoURL: 'https://openbao.github.io/openbao-helm'
      targetRevision: '0.30.8'
      chart: openbao
      helm:
        releaseName: openbao
        valueFiles:
          - $values/openbao/values.yaml

    - repoURL: https://github.com/ZakDaMack/homelab
      targetRevision: HEAD
      ref: values

  ignoreDifferences:
    # The injector rotates the webhook's CA bundle, showing OutOfSync
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: openbao-agent-injector-cfg
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    automated:
      prune: true
      selfHeal: true