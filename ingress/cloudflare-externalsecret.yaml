apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflare-secret-reader
  namespace: ingress
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudflare-secret-reader-token
  namespace: ingress
rules:
  - apiGroups:
      - ""
    resources:
      - serviceaccounts/token
    resourceNames:
      - cloudflare-secret-reader
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudflare-secret-reader-token
  namespace: ingress
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudflare-secret-reader-token
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-cloudflare
  namespace: ingress
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    openBao:
      server: http://openbao.openbao.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          path: kubernetes
          role: eso-ingress-cloudflare
          serviceAccountRef:
            name: cloudflare-secret-reader
            audiences:
              - openbao
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: ingress
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao-cloudflare
  target:
    name: cloudflare-api-token
  data:
    - secretKey: api-token
      remoteRef:
        key: keys/cloudflare
        property: api_token
