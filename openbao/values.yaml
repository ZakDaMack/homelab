global:
  enabled: true
  tlsDisable: true
  serverTelemetry:
    prometheusOperator: true

injector:
  affinity: ""
  metrics:
    enabled: true
  logLevel: "info"
  logFormat: "standard"

csi:
  enabled: false

ui:
  enabled: true

server:
  ingress:
    enabled: true
    ingressClassName: ingress-traefik
    hosts:
      - host: openbao.k8s.zakhaven.uk
        paths:
          - /
